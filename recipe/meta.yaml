{% set name = "camelot-py" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 62514bd9effaef39a34c850f4b09705a817be160483b028cc8cde14954721466

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - camelot = camelot.cli:cli
  # No opencv-python-headless for py313+ because of setuptools <70
  # No pypdf >=3.17,<4.0 for py<312 in the main channel
  skip: true  # [py!=312]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    - click >=8.0.1
    - chardet >=5.1.0
    - numpy >=1.24.4  # [py<312]
    - numpy >=1.26.1  # [py>=312]
    - openpyxl >=3.1.0
    - pdfminer.six >=20240706
    - pypdf >=3.17,<4.0  # [py<312]
    - pypdf >=4.0,<6.0  # [py>=312]
    - pandas >=1.5.3  # [py<310]
    - pandas >=2.2.2  # [py>=310]
    - tabulate >=0.9.0
    - typing-extensions >=4.12.2  # [py<311]
    - opencv-python-headless >=4.7.0.68
    - pypdfium2 >=4
  run_constrained:
    # plot
    - matplotlib >=3.7.5  # [py<312]
    - matplotlib >=3.8.0  # [py>=312]
    # ghostscript
    - ghostscript>=0.7

test:
  imports:
    - camelot
  commands:
    - camelot --help

about:
  home: https://github.com/camelot-dev/camelot
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: PDF Table Extraction for Humans.
  description: PDF Table Extraction for Humans.
  dev_url: https://github.com/camelot-dev/camelot
  doc_url: https://camelot-py.readthedocs.io

extra:
  recipe-maintainers:
    - vinayak-mehta
    - izahn
